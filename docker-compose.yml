services:
  admin:
    build: ./server
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: '8000'
      COOKIE_SECURE: '1'
    volumes:
      - patch_data:/data
    expose:
      - '8000'
    networks:
      - private
  https:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - admin
    networks:
      - private
networks:
  private:
volumes:
  patch_data:
  caddy_data:
  caddy_config:

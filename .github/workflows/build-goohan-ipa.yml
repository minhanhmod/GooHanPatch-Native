name: Build GooHan Patch experimental IPA

on:
  workflow_dispatch:
  push:
    branches:
      - gohan-hybrid-ios27-test
    paths:
      - .github/workflows/build-goohan-ipa.yml
      - bridge/GooHan3106Remote.swift
      - scripts/integrate_goohan_3106.py
      - ThreeOneOSFive/helpers/LicenseManager.swift

permissions:
  contents: read

jobs:
  build-iphone:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify GOHAN source and deleted patch resources
        shell: bash
        run: |
          set -euo pipefail
          test -f ThreeOneOSFive.xcodeproj/xcshareddata/xcschemes/GOHAN.xcscheme
          test -f ThreeOneOSFive.xcodeproj/project.pbxproj
          if find ThreeOneOSFive/Patches -type f -name '*.3105' -print -quit | grep -q .; then
            echo 'ERROR: Bundled .3105 files still exist in source.' >&2
            exit 1
          fi
          echo 'PASS: no bundled .3105 files; GOHAN scheme found'

      - name: Check Hybrid iOS backend policy
        shell: bash
        run: bash scripts/check_hybrid_backend.sh

      - name: Verify 3106 schema-3 import compatibility
        shell: bash
        run: bash scripts/check_3106_schema3.sh

      - name: Verify Admin 3105/3106 publication compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/goohan-admin-check
          /tmp/goohan-admin-check/bin/python -m pip install -q -r server/requirements.txt
          /tmp/goohan-admin-check/bin/python -m unittest discover -s tests -p 'test_3106_admin.py' -v

      - name: Check 3106 preflight status display
        shell: bash
        run: python3 scripts/check_3106_ui_strings.py

      - name: Check sandbox write-and-restore diagnostic isolation
        shell: bash
        run: python3 scripts/check_sandbox_transaction_probe.py

      - name: Check signed App Groups and backend diagnostic
        shell: bash
        run: python3 scripts/check_signed_app_group_preflight.py

      - name: Validate signed-IPA audit tool
        shell: bash
        run: |
          python3 -m py_compile scripts/audit_signed_ipa.py
          python3 scripts/audit_signed_ipa.py --help > /dev/null

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcodebuild -list -project ThreeOneOSFive.xcodeproj

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme GOHAN \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/GOHAN.app"
          test -d "$APP" || { echo "GOHAN.app not found at $APP" >&2; exit 1; }
          test -f "$APP/GOHAN" || { echo 'GOHAN executable missing' >&2; exit 1; }
          mkdir -p "$PWD/dist/Payload"
          ditto "$APP" "$PWD/dist/Payload/GOHAN.app"
          cd dist
          /usr/bin/zip -q -r -y GooHanPatch-experimental-unsigned.ipa Payload
          /usr/bin/unzip -t GooHanPatch-experimental-unsigned.ipa | tail -n 2
          if /usr/bin/unzip -Z1 GooHanPatch-experimental-unsigned.ipa | grep -E '\.3105$'; then
            echo 'ERROR: Bundled .3105 remains in the IPA' >&2
            exit 1
          fi
          shasum -a 256 GooHanPatch-experimental-unsigned.ipa > GooHanPatch-experimental-unsigned.ipa.sha256
          echo 'PASS: GOHAN.app / GOHAN executable, no bundled .3105'

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GooHanPatch-experimental-IPA
          path: |
            dist/GooHanPatch-experimental-unsigned.ipa
            dist/GooHanPatch-experimental-unsigned.ipa.sha256
          if-no-files-found: error


  # Build the entire upstream 3106 application and backend as a separate,
  # isolated native baseline. This is NOT the existing GooHan client; no
  # partial/mock worse_query adapter is substituted for upstream code.
  build-native-3106-engine:
    if: github.ref == 'refs/heads/gohan-hybrid-ios27-test'
    runs-on: macos-15
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout exact 3106 upstream source
        uses: actions/checkout@v4
        with:
          repository: QuinnTang74/3106
          ref: 832bad906c06d92f55cabf799166f00d45d6a978
          path: upstream3106
          persist-credentials: false

      - name: Verify full upstream engine and license source
        shell: bash
        run: |
          set -euo pipefail
          cd upstream3106
          test "$(git rev-parse HEAD)" = "832bad906c06d92f55cabf799166f00d45d6a978"
          test -f ThreeOneOSSix/exploit/worse_query.m
          test -f ThreeOneOSSix/exploit/worse_query.h
          test -f ThreeOneOSSix/helpers/SandboxAccess.swift
          test -f ThreeOneOSSix/helpers/KernelExploit.swift
          test -f ThreeOneOSSix/helpers/PatchTransaction.swift
          test -f ThreeOneOSSix/ThreeOneOSSix.entitlements
          test -f LICENSE
          test -f NOTICE.md
          echo "PASS: original 3106 native source and all backend components present"

      # Only the visible name is adjusted. Preserve the original bundle ID,
      # original App Group entitlement request, all engine and UI source, and
      # all upstream grant/write/restore flows for a clean baseline.
      - name: Set GooHan experimental display name only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          p = Path("upstream3106/ThreeOneOSSix/Info.plist")
          with p.open("rb") as f:
              info = plistlib.load(f)
          assert info["CFBundleIdentifier"] == "com.qingtang.3106"
          info["CFBundleDisplayName"] = "GooHan 3106 Engine"
          with p.open("wb") as f:
              plistlib.dump(info, f, sort_keys=False)
          project = Path("upstream3106/ThreeOneOSSix.xcodeproj/project.pbxproj")
          old = "INFOPLIST_KEY_CFBundleDisplayName = 3106;"
          content = project.read_text(encoding="utf-8")
          assert content.count(old) == 2
          project.write_text(
              content.replace(old, 'INFOPLIST_KEY_CFBundleDisplayName = "GooHan 3106 Engine";'),
              encoding="utf-8",
          )
          PY

      - name: Build complete upstream 3106 iPhone engine
        shell: bash
        run: |
          set -euo pipefail
          cd upstream3106
          xcodebuild -version
          xcodebuild \
            -project ThreeOneOSSix.xcodeproj \
            -scheme 3106 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/native-3106-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package isolated 3106 engine IPA and its GPL source
        shell: bash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/native-3106-build/Build/Products/Release-iphoneos/3106.app"
          test -d "$APP"
          test -f "$APP/3106"
          mkdir -p "$GITHUB_WORKSPACE/native-3106-output/Payload"
          ditto "$APP" "$GITHUB_WORKSPACE/native-3106-output/Payload/3106.app"
          cd "$GITHUB_WORKSPACE/native-3106-output"
          /usr/bin/zip -q -r -y 3106-upstream-engine-for-GooHan-unsigned.ipa Payload
          /usr/bin/unzip -t 3106-upstream-engine-for-GooHan-unsigned.ipa | tail -n 2
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/3106.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Payload/3106.app/Info.plist
          shasum -a 256 3106-upstream-engine-for-GooHan-unsigned.ipa > 3106-upstream-engine-for-GooHan-unsigned.ipa.sha256
          cp "$GITHUB_WORKSPACE/upstream3106/LICENSE" .
          cp "$GITHUB_WORKSPACE/upstream3106/NOTICE.md" .
          # Include the complete corresponding upstream source, not only a
          # binary. The one-file display-name-only edit is in this workflow.
          git -C "$GITHUB_WORKSPACE/upstream3106" archive --format=zip \
            --output="$PWD/3106-upstream-source-832bad9.zip" \
            832bad906c06d92f55cabf799166f00d45d6a978
          cat > READ_ME_FIRST.txt <<'EOF'
          GOOHAN iOS27 - FULL UPSTREAM 3106 ENGINE BASELINE
          Source: QuinnTang74/3106, commit 832bad906c06d92f55cabf799166f00d45d6a978
          License: GPL-3.0; see LICENSE, NOTICE.md and included source archive.
          This is the full upstream 3106 app with only its display name changed.
          Its Bundle ID is still com.qingtang.3106; it is NOT the GooHan Admin/License app.
          This baseline isolates the iOS 27 backend before combining it with GooHan.
          The resulting IPA is unsigned. iOS 27 worse_query requires a valid
          signing profile with a matching App Groups entitlement. A wildcard
          profile or an unsupported signer will not provide that capability.
          Do not replace your existing GooHan IPA with this baseline.
          EOF

      - name: Upload independent full 3106 engine baseline
        uses: actions/upload-artifact@v4
        with:
          name: GooHan-full-3106-native-engine-baseline
          path: |
            native-3106-output/3106-upstream-engine-for-GooHan-unsigned.ipa
            native-3106-output/3106-upstream-engine-for-GooHan-unsigned.ipa.sha256
            native-3106-output/3106-upstream-source-832bad9.zip
            native-3106-output/LICENSE
            native-3106-output/NOTICE.md
            native-3106-output/READ_ME_FIRST.txt
          if-no-files-found: error


  # The first ACTUAL GooHan application based on the full 3106 backend:
  # overlays GooHan Admin/License onto upstream 3106's project without
  # replacing its sandbox, transaction, cache recovery or file access engine.
  build-goohan-full-3106:
    if: github.ref == 'refs/heads/gohan-hybrid-ios27-test'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout GooHan Admin and License overlay
        uses: actions/checkout@v4
        with:
          path: gohan
          persist-credentials: false

      - name: Checkout pinned full upstream 3106 source
        uses: actions/checkout@v4
        with:
          repository: QuinnTang74/3106
          ref: 832bad906c06d92f55cabf799166f00d45d6a978
          path: upstream3106
          persist-credentials: false

      - name: Integrate GooHan Admin and License into original 3106 app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream3106 rev-parse HEAD)" = "832bad906c06d92f55cabf799166f00d45d6a978"
          python3 gohan/scripts/integrate_goohan_3106.py upstream3106 gohan
          grep -q 'GooHan3106Remote.swift in Sources' upstream3106/ThreeOneOSSix.xcodeproj/project.pbxproj
          grep -q 'worse_query.m in Sources' upstream3106/ThreeOneOSSix.xcodeproj/project.pbxproj
          grep -q 'SandboxAccess.swift in Sources' upstream3106/ThreeOneOSSix.xcodeproj/project.pbxproj

      - name: Build GooHan on the complete 3106 engine
        shell: bash
        run: |
          set -euo pipefail
          cd upstream3106
          xcodebuild \
            -project ThreeOneOSSix.xcodeproj \
            -scheme 3106 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/gohan-native3106-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package GooHan native 3106 IPA, source and license
        shell: bash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/gohan-native3106-build/Build/Products/Release-iphoneos/3106.app"
          test -d "$APP" && test -f "$APP/3106"
          mkdir -p "$GITHUB_WORKSPACE/gohan3106-dist/Payload"
          ditto "$APP" "$GITHUB_WORKSPACE/gohan3106-dist/Payload/3106.app"
          cd "$GITHUB_WORKSPACE/gohan3106-dist"
          /usr/bin/zip -q -r -y GooHan-Patch-full-3106-native-unsigned.ipa Payload
          /usr/bin/unzip -t GooHan-Patch-full-3106-native-unsigned.ipa | tail -n 2
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/3106.app/Info.plist)" = "com.qingtang.3106"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Payload/3106.app/Info.plist
          shasum -a 256 GooHan-Patch-full-3106-native-unsigned.ipa > GooHan-Patch-full-3106-native-unsigned.ipa.sha256
          cp "$GITHUB_WORKSPACE/upstream3106/LICENSE" .
          cp "$GITHUB_WORKSPACE/upstream3106/NOTICE.md" .
          cp "$GITHUB_WORKSPACE/gohan/LICENSE" GooHan-LICENSE.txt
          # Full corresponding, patched source: .git metadata excluded.
          cd "$GITHUB_WORKSPACE"
          /usr/bin/zip -q -r gohan3106-dist/GooHan-3106-native-corresponding-source.zip \
            upstream3106/ThreeOneOSSix upstream3106/ThreeOneOSSix.xcodeproj \
            gohan/bridge/GooHan3106Remote.swift \
            gohan/scripts/integrate_goohan_3106.py \
            gohan/ThreeOneOSFive/helpers/LicenseManager.swift \
            upstream3106/LICENSE upstream3106/NOTICE.md
          cat > gohan3106-dist/READ_ME_FIRST.txt <<'EOF'
          GOOHAN PATCH - FULL 3106 NATIVE ENGINE (EXPERIMENTAL)
          Original backend: QuinnTang74/3106, commit 832bad906c06d92f55cabf799166f00d45d6a978.
          Full native worse_query, SandboxAccess, DevicePatchService and
          PatchTransaction remain from upstream; no substitute sandbox driver.
          GooHan's server-side LicenseManager and remote Patch Library are
          compiled into the same native 3106 app.
          On 3106's home screen open 'GooHan Patch - Dong bo tu Admin'.
          This is NOT yet the merged 3105/3106 hybrid. GooHan's old IPA
          remains separately installable.
          Bundle ID: com.qingtang.3106 (so it replaces any separately
          installed original 3106 app, NOT the existing GooHan Patch app).
          SIGNING: use a valid explicit App ID / provisioning profile with
          an App Groups entitlement. Unsigned IPA cannot carry a valid grant.
          Applying remote patches is not guaranteed: iOS permissions, the
          actual signed entitlements and device compatibility must permit it.
          Never claim an Apply succeeded without the native write receipt.
          License/remote client storage is separate from the old GooHan app.
          This experimental source is GPL-3.0 with upstream attribution.
          EOF

      - name: Upload GooHan full-native-3106 integrated IPA
        uses: actions/upload-artifact@v4
        with:
          name: GooHan-Patch-full-native-3106-integrated
          path: |
            gohan3106-dist/GooHan-Patch-full-3106-native-unsigned.ipa
            gohan3106-dist/GooHan-Patch-full-3106-native-unsigned.ipa.sha256
            gohan3106-dist/GooHan-3106-native-corresponding-source.zip
            gohan3106-dist/LICENSE
            gohan3106-dist/NOTICE.md
            gohan3106-dist/GooHan-LICENSE.txt
            gohan3106-dist/READ_ME_FIRST.txt
          if-no-files-found: error

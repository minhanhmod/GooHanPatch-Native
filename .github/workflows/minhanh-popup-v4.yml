name: MinhAnh Popup V4 Build

on:
  push:
    branches: [minhanh-popup-v4-blockblast]
    paths:
      - "tools/minhanh-popup-v4/**"
      - ".github/workflows/minhanh-popup-v4.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile ARM64 iOS dylib
        run: |
          set -euxo pipefail
          cd tools/minhanh-popup-v4
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -x c -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=12.0 -fblocks -Wno-cast-function-type-mismatch \
            -O2 -dynamiclib \
            -Wl,-install_name,@rpath/MinhAnhPopup_V4.dylib \
            -o MinhAnhPopup_V4.dylib MinhAnhPopup_V4.c \
            -framework UIKit -framework Foundation -lobjc -ldispatch
          file MinhAnhPopup_V4.dylib
          xcrun vtool -show-build MinhAnhPopup_V4.dylib
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: MinhAnhPopup_V4
          path: tools/minhanh-popup-v4/MinhAnhPopup_V4.dylib
